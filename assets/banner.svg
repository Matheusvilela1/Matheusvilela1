<style>
  .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .eyebrow { font-size: 15px; letter-spacing: 3px; fill: #a7a3d6; }
  .eyebrow tspan { fill: #ff3b5c; }
  .tag { font-size: 12px; fill: #fff; }
  .cmd { font-size: 13px; fill: #7c78b8; }
  .out { font-size: 14px; }
  .lbl { font-size: 12px; fill: #fff; font-weight: 700; }
  .frame { fill: none; stroke: #5b8cff; stroke-width: 1.6; stroke-dasharray: 1; animation: draw 0.9s cubic-bezier(.65,0,.35,1) 0.2s both; }
  .h { fill: #fff; stroke: #5b8cff; stroke-width: 1.6; animation: pop 0.3s ease 1s both; }
  .ftag { animation: pop 0.3s ease 1s both; }
  .rise { animation: rise 0.8s cubic-bezier(.2,.8,.2,1) both; }
  .term { animation: fade 0.6s ease 1.2s both; }
  .tl { animation: fade 0.35s steps(4) both; }
  .caret { animation: blink 1s steps(1) 3.8s infinite; }
  .cur { animation: fade 0.5s ease 3s both; }
  .cur-a { animation: fade 0.5s ease 3s both, path-a 9s ease-in-out 3s infinite; }
  .cur-b { animation: fade 0.5s ease 3.4s both, path-b 11s ease-in-out 3.4s infinite; }
  @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
  @keyframes pop { from { opacity: 0; transform: scale(0.6); } }
  @keyframes rise { from { transform: translateY(150px); } }
  @keyframes fade { from { opacity: 0; } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes path-a {
    0%, 100% { transform: translate(640px, 300px); }
    30% { transform: translate(560px, 150px); }
    55% { transform: translate(700px, 92px); }
    80% { transform: translate(690px, 330px); }
  }
  @keyframes path-b {
    0%, 100% { transform: translate(1100px, 370px); }
    35% { transform: translate(960px, 350px); }
    65% { transform: translate(1140px, 70px); }
  }
  .h, .ftag { transform-box: fill-box; transform-origin: center; }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
    .cur-a { transform: translate(640px, 300px); }
    .cur-b { transform: translate(1100px, 370px); }
  }
</style>

